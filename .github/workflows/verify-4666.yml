name: verify-4666
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -q -r tests/requirements-test.txt && pip install -q -r docker/backend/requirements.txt || pip install -q -r src/backend/requirements.txt
      - name: new + touched tests
        run: cd tests && python -m pytest -q -p no:randomly unit/test_4666_admin_self_share.py unit/test_837_workspace_only_floor.py unit/test_ent459_operator_invite.py unit/test_ent719_inline_layer_matches_route_rule.py unit/test_ent357_workspace_owned_roster.py unit/test_4579_credential_primary_reach.py 2>&1 | tail -30
      - name: new tests on dev code (must fail)
        run: git checkout HEAD~1~1 -- src && cd tests && python -m pytest -q -p no:randomly unit/test_4666_admin_self_share.py 2>&1 | tail -15
